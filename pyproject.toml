[project]
name = "moosey-cms"
version = "0.9.5"
description = "A lightweight, drop-in Markdown CMS for FastAPI with hot reloading"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Anthony Mugendi", github = "https://github.com/mugendi" }
]
keywords = ["fastapi", "cms", "markdown", "hot-reload", "jinja2", "seo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content :: Content Management System",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Framework :: FastAPI",
]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bleach>=6.0,<7",
    "cachetools>=6.2.4",
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "inflection>=0.5.1",
    "jinja2>=3.1.6",
    "markdown>=3.10",
    "minify-html>=0.18.1",
    "pycountry>=26.2.16",
    "pymdown-extensions>=10.20",
    "pynacl>=1.6.2",
    "pytest>=9.1.1",
    "python-frontmatter>=1.1.0",
    "python-slugify>=8.0.4",
    "ruamel.yaml>=0.18.0",
    "uvicorn[standard]>=0.40.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
images = ["pillow>=10.0"]
faces = ["pillow>=10.0", "opencv-python-headless>=4.9,<5"]
cdn = []
all = ["pillow>=10.0", "opencv-python-headless>=4.9,<5"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project.urls]
Homepage = "https://github.com/mugendi/moosey-cms"
Repository = "https://github.com/mugendi/moosey-cms"
"Bug Tracker" = "https://github.com/mugendi/moosey-cms/issues"
Documentation = "https://github.com/mugendi/moosey-cms/blob/master/docs"
Changelog = "https://github.com/mugendi/moosey-cms/commits/master/"

[project.scripts]
moosey-cms = "moosey_cms.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moosey_cms"]
artifacts = ["src/moosey_cms/_admin_templates/**"]
